<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
<script>
  /* global p5 */
  const sketch = (p) => {
    p.setup = () => {
      p.createCanvas(950, 400);
      p.background("#FAF0EB");
    }

    p.draw = () => {
      p.fill(p.random(100,256), p.random(100,256), p.random(100,256));
      p.rect(p.mouseX, p.mouseY, 10, 30);
    }
  }
  new p5(sketch);
</script>
